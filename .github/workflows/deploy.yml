# ─────────────────────────────────────────────────────────────────────────────
# GitHub Pages Deployment Workflow
# Deploys the bakery template to GitHub Pages on every push to main/master.
#
# SETUP STEPS:
# 1. Push this repo to GitHub
# 2. Go to Settings → Pages → Source → GitHub Actions
# 3. Push to main — the site goes live at https://<username>.github.io/<repo>/
#
# If you later move to Vercel:
# 1. Import the GitHub repo in Vercel dashboard
# 2. No build command needed (static site)
# 3. Output directory: ./ (root)
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Tailwind CSS
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
